id: vaultwarden
title: Vaultwarden
line: A password manager the Bitwarden apps can use.
category: tools
icons: [vaultwarden]
note: Bitwarden apps and the web vault work only over HTTPS, which Yawl gives every web service. Create your account, then set SIGNUPS_ALLOWED to false in vaultwarden's Environment. Set DOMAIN there to its https address for passkeys and email links.
services:
  - {name: vaultwarden, kind: web, image: "vaultwarden/server:1.37.5", port: 80, health_path: /alive, volumes: [{name: data, path: /data}], memory: 256MB}
