id: umami
title: Umami
line: Website analytics without cookies.
category: analytics
icons: [umami]
note: Log in as admin with the password umami, then change it at once.
services:
  - {name: umami-db, kind: postgres, memory: 512MB}
  - {name: umami, kind: web, image: "ghcr.io/umami-software/umami:postgresql-v2.20.2", port: 3000, memory: 512MB}
vars:
  - {service: umami, key: DATABASE_URL, kind: ref, value: umami-db.url}
  - {service: umami, key: APP_SECRET, kind: generate}
