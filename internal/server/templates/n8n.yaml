id: n8n
title: n8n
line: Workflows that connect your apps.
category: automation
icons: [n8n]
note: Open it and create the owner account.
services:
  # stable pointed at 2.46.6 on 2026-11-05 (2.47.x is the next, beta, line). Kept on SQLite in its volume:
  # n8n reads Postgres only as DB_POSTGRESDB_HOST, _USER, _PASSWORD and the rest, never one URL, and its
  # entrypoint runs every command as n8n's own, so no shell can split a Yawl reference for it.
  - {name: n8n, kind: web, image: "n8nio/n8n:2.46.6", port: 5678, health_path: /healthz, volumes: [{name: data, path: /home/node/.n8n}], memory: 512MB}
vars:
  - {service: n8n, key: N8N_ENCRYPTION_KEY, kind: generate}
